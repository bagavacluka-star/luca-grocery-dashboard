name: Grocery dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '25 20 * * *'
      timezone: Europe/Belgrade
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check retailer sources without changing the published site
        type: boolean
        default: false
      send_test_email:
        description: Send one test email after refreshing prices
        type: boolean
        default: false
      send_daily_email:
        description: Send today's daily email if the schedule was missed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grocery-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install refresh dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Refresh prices
        if: github.event_name != 'push'
        run: python scripts/refresh.py

      - name: Check data
        run: python scripts/check_data.py

      - name: Save daily history
        if: github.event_name != 'push' && inputs.verify_only != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/data.js
          if ! git diff --cached --quiet; then
            git commit -m "Daily grocery price refresh"
            git push
          fi

      - name: Configure Pages
        if: inputs.verify_only != true
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: inputs.verify_only != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to Pages
        if: inputs.verify_only != true
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send grocery email
        if: (github.event_name == 'schedule' && vars.EMAIL_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.send_test_email == true || inputs.send_daily_email == true))
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TEST: ${{ inputs.send_test_email }}
        run: |
          if [ "$MAIL_TEST" = "true" ]; then
            python scripts/email_report.py --send --test
          else
            python scripts/email_report.py --send
          fi

      - name: Save email delivery marker
        if: (github.event_name == 'schedule' && vars.EMAIL_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.send_test_email == true || inputs.send_daily_email == true))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mail-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record grocery email delivery"
            git push
          fi
